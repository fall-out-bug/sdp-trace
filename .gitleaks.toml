title = "sdp-trace reviewed secret-scan allowlist"

[extend]
useDefault = true

[allowlist]
description = "Synthetic secret markers for redaction tests and review evidence"

regexes = [
  '''eyJhbGciOiJFZERTQSJ9\.eyJzdWIiOiJibG9jazIyIn0\.signaturesecret''',
  '''crisis-(glm-critic|judge|kimi-critic)-\d{4}-\d{2}-\d{2}''',
  '''"-----begin private key-----"''',
  '''"-----begin rsa private key-----"''',
  '''"-----begin ec private key-----"''',
]
