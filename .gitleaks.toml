title = "sdp-trace reviewed secret-scan allowlist"

[extend]
useDefault = true

[allowlist]
description = "Synthetic secret markers for redaction tests and review evidence"

regexes = [
  '''eyJhbGciOiJFZERTQSJ9\.eyJzdWIiOiJibG9jazIyIn0\.signaturesecret''',
  '''crisis-(glm-critic|judge|kimi-critic)-\d{4}-\d{2}-\d{2}''',
  '''-----begin private key-----''',
]

paths = [
  '''^examples/self-trace/(assessment-input|evidence-events|negative-native-policy-field)\.json$''',
  '''^internal/witness/profiles_test\.go$''',
  '''^specs/004-mvp-readiness-hardening/pr-review/ec8db52/packet/inputs/diff\.patch$''',
]
