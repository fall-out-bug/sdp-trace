title = "sdp-trace reviewed secret-scan allowlist"

[extend]
useDefault = true

[allowlist]
description = "Exact synthetic secret markers for redaction tests and review evidence. These strings are intentionally placed in test fixtures and historical diffs; they do not match real credentials."

regexes = [
  '''eyJhbGciOiJFZERTQSJ9\.eyJzdWIiOiJibG9jazIyIn0\.signaturesecret''',
  '''crisis-(glm-critic|judge|kimi-critic)-\d{4}-\d{2}-\d{2}''',
  '''"-----begin (private key|rsa private key|ec private key)-----"''',
]
