title = "sdp-trace reviewed secret-scan allowlist"

[extend]
useDefault = true

# Each allowlist is scoped to a specific known-fixture file (paths) and an
# exact synthetic string pattern (regexes). Gitleaks v8 treats entries within
# one [[allowlists]] block as OR; because the regexes are exact synthetic
# markers and the paths are the only files that contain them, the practical
# scope is narrow. Do not broaden paths or regexes without review.

[[allowlists]]
description = "Self-trace dedupe keys are fixture labels, not credentials."
paths = ['''^examples/self-trace/(assessment-input|evidence-events|negative-native-policy-field)\.json$''']
regexes = ['''crisis-(glm-critic|judge|kimi-critic)-\d{4}-\d{2}-\d{2}''']

[[allowlists]]
description = "Witness tests use a synthetic JWT-shaped sentinel to verify redaction."
paths = ['''^internal/witness/profiles_test\.go$''']
regexes = ['''eyJhbGciOiJFZERTQSJ9\.eyJzdWIiOiJibG9jazIyIn0\.signaturesecret''']

[[allowlists]]
description = "Historical review fixture contains private-key marker text from a sanitized diff."
paths = ['''^specs/004-mvp-readiness-hardening/pr-review/ec8db52/packet/inputs/diff\.patch$''']
regexes = ['''"-----begin (private key|rsa private key|ec private key)-----"''']
