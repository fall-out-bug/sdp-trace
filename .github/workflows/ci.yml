name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests
        run: go test ./... -coverprofile=coverage.out
      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
      - name: JSON syntax
        run: jq empty schema/*.json examples/block19-adapter-capture/*.json
      - name: Whitespace check
        run: git diff --check
